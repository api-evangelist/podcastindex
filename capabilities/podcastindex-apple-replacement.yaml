naftiko: 1.0.0-alpha2
info:
  label: PodcastIndex.org API — Apple Replacement
  description: 'PodcastIndex.org API — Apple Replacement. 2 operations. Lead operation: Lookup. Self-contained Naftiko capability
    covering one Podcastindex business surface.'
  tags:
  - Podcastindex
  - Apple Replacement
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    PODCASTINDEX_API_KEY: PODCASTINDEX_API_KEY
capability:
  consumes:
  - type: http
    namespace: podcastindex-apple-replacement
    baseUri: https://api.podcastindex.org/api/1.0
    description: PodcastIndex.org API — Apple Replacement business capability. Self-contained, no shared references.
    resources:
    - name: lookup
      path: /lookup
      operations:
      - name: lookup
        method: GET
        description: Lookup
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: search
      path: /search
      operations:
      - name: search
        method: GET
        description: Search
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: apikey
      key: User-Agent
      value: '{{env.PODCASTINDEX_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: podcastindex-apple-replacement-rest
    port: 8080
    description: REST adapter for PodcastIndex.org API — Apple Replacement. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/lookup
      name: lookup
      description: REST surface for lookup.
      operations:
      - method: GET
        name: lookup
        description: Lookup
        call: podcastindex-apple-replacement.lookup
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/search
      name: search
      description: REST surface for search.
      operations:
      - method: GET
        name: search
        description: Search
        call: podcastindex-apple-replacement.search
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: podcastindex-apple-replacement-mcp
    port: 9090
    transport: http
    description: MCP adapter for PodcastIndex.org API — Apple Replacement. One tool per consumed operation, routed inline
      through this capability's consumes block.
    tools:
    - name: lookup
      description: Lookup
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: podcastindex-apple-replacement.lookup
      outputParameters:
      - type: object
        mapping: $.
    - name: search
      description: Search
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: podcastindex-apple-replacement.search
      outputParameters:
      - type: object
        mapping: $.
